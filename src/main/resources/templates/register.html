<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inscription</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex; align-items: center; justify-content: center;
        }
        .bg-circles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; }
        .bg-circles li { position: absolute; display: block; list-style: none;
            width: 20px; height: 20px; background: rgba(255,255,255,0.1);
            border-radius: 50%; animation: float 25s linear infinite; bottom: -150px; }
        .bg-circles li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .bg-circles li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .bg-circles li:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .bg-circles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .bg-circles li:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 0; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }
        .container { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 20px; }
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px; padding: 50px 40px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo { text-align: center; margin-bottom: 35px; }
        .logo-icon {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            border-radius: 20px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 30px; margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0, 176, 155, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(0, 176, 155, 0.4); }
            50% { box-shadow: 0 10px 50px rgba(0, 176, 155, 0.8); }
        }
        .logo h1 { color: white; font-size: 26px; font-weight: 700; }
        .logo p { color: rgba(255,255,255,0.6); font-size: 14px; margin-top: 5px; }
        .form-group { margin-bottom: 22px; }
        label { display: block; color: rgba(255,255,255,0.8); font-size: 13px;
            font-weight: 600; margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
        .input-wrapper { position: relative; }
        .input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 18px; opacity: 0.7; }
        input { width: 100%; padding: 15px 15px 15px 48px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px; color: white; font-size: 15px; transition: all 0.3s ease; outline: none; }
        input::placeholder { color: rgba(255,255,255,0.4); }
        input:focus { background: rgba(255,255,255,0.15); border-color: #00b09b;
            box-shadow: 0 0 0 3px rgba(0,176,155,0.2); }
        .btn-register {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            border: none; border-radius: 12px; color: white;
            font-size: 16px; font-weight: 700; cursor: pointer;
            letter-spacing: 1px; transition: all 0.3s ease;
            margin-top: 10px; text-transform: uppercase;
        }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,176,155,0.5); }
        .divider { text-align: center; color: rgba(255,255,255,0.4); margin: 25px 0; position: relative; }
        .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: rgba(255,255,255,0.2); }
        .divider::before { left: 0; } .divider::after { right: 0; }
        .links { text-align: center; color: rgba(255,255,255,0.6); font-size: 14px; }
        .links a { color: #00b09b; text-decoration: none; font-weight: 600; }
        .success-msg { background: rgba(0,176,155,0.2); border: 1px solid rgba(0,176,155,0.4);
            color: #00e5cc; padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; text-align: center; }
        .error-msg { background: rgba(255,80,80,0.2); border: 1px solid rgba(255,80,80,0.4);
            color: #ff6b6b; padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
<ul class="bg-circles">
    <li></li><li></li><li></li><li></li><li></li>
</ul>
<div class="container">
    <div class="card">
        <div class="logo">
            <div class="logo-icon">📝</div>
            <h1>Créer un compte</h1>
            <p>Rejoignez-nous dès aujourd'hui</p>
        </div>
        <div class="success-msg" th:if="${success}" th:text="${success}"></div>
        <div class="error-msg" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/auth/register-form}" method="post">
            <div class="form-group">
                <label>Nom d'utilisateur</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" name="username" placeholder="Choisissez un username" required/>
                </div>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔑</span>
                    <input type="password" name="password" placeholder="Choisissez un mot de passe" required/>
                </div>
            </div>
            <button class="btn-register" type="submit">S'inscrire →</button>
        </form>
        <div class="divider">ou</div>
        <div class="links">
            <p>Déjà un compte ? <a th:href="@{/auth/login-form}">Se connecter</a></p>
        </div>
    </div>
</div>
</body>
</html>
