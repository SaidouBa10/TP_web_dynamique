<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Blog</title>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
        }
        .navbar {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 0 40px;
            display: flex; align-items: center;
            justify-content: space-between;
            height: 70px;
        }
        .navbar-brand { display: flex; align-items: center; gap: 12px; }
        .navbar-brand .icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .navbar-brand h2 { font-size: 18px; font-weight: 700; }
        .nav-links { display: flex; gap: 15px; }
        .nav-link {
            padding: 8px 20px; border-radius: 20px;
            text-decoration: none; font-size: 14px;
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.3s;
        }
        .nav-link:hover, .nav-link.active {
            background: rgba(0,176,155,0.2);
            color: #00b09b; border-color: rgba(0,176,155,0.4);
        }
        .main { padding: 40px; }
        .page-header { margin-bottom: 35px; animation: slideUp 0.5s ease; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .page-header h1 { font-size: 36px; font-weight: 800; }
        .page-header h1 span {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .form-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px; padding: 30px; margin-bottom: 35px;
        }
        .form-card h2 { font-size: 18px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600;
            color: rgba(255,255,255,0.6); margin-bottom: 8px;
            text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px; color: white; font-size: 14px;
            transition: all 0.3s; outline: none; font-family: inherit;
        }
        .form-group input::placeholder, .form-group textarea::placeholder { color: rgba(255,255,255,0.3); }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #00b09b;
            box-shadow: 0 0 0 3px rgba(0,176,155,0.15);
        }
        .btn-add {
            padding: 12px 28px;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            border: none; border-radius: 10px;
            color: white; font-weight: 700; font-size: 14px;
            cursor: pointer; transition: all 0.3s;
        }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,176,155,0.4); }
        .articles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .article-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px; padding: 25px;
            transition: all 0.3s; position: relative; overflow: hidden;
        }
        .article-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(135deg, #00b09b, #96c93d);
        }
        .article-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
        .article-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
        .article-content { color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .article-footer { display: flex; align-items: center; justify-content: space-between; }
        .comment-count {
            background: rgba(0,176,155,0.2); color: #00e5cc;
            padding: 5px 12px; border-radius: 20px; font-size: 13px;
        }
        .article-actions { display: flex; gap: 10px; }
        .btn-view {
            padding: 8px 18px;
            background: rgba(0,176,155,0.2);
            border: 1px solid rgba(0,176,155,0.4);
            border-radius: 8px; color: #00b09b;
            text-decoration: none; font-size: 13px; transition: all 0.3s;
        }
        .btn-view:hover { background: rgba(0,176,155,0.4); }
        .btn-delete {
            padding: 8px 16px;
            background: rgba(255,80,80,0.15);
            border: 1px solid rgba(255,80,80,0.3);
            border-radius: 8px; color: #ff6b6b;
            text-decoration: none; font-size: 13px; transition: all 0.3s;
        }
        .btn-delete:hover { background: rgba(255,80,80,0.3); }
        .empty-state { text-align: center; padding: 60px; color: rgba(255,255,255,0.4); }
        .empty-state .empty-icon { font-size: 50px; margin-bottom: 15px; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-brand">
        <div class="icon">📝</div>
        <h2>Blog</h2>
    </div>
    <div class="nav-links">
        <a th:href="@{/auth/dashboard}" class="nav-link">🏠 Dashboard</a>
        <a th:href="@{/products}" class="nav-link">📦 Produits</a>
        <a th:href="@{/articles}" class="nav-link active">📝 Blog</a>
    </div>
</nav>

<div class="main">
    <div class="page-header">
        <h1>📝 <span>Mon Blog</span></h1>
        <p>Gérez vos articles et commentaires</p>
    </div>

    <!-- Formulaire -->
    <div class="form-card">
        <h2>✏️ Nouvel article</h2>
        <form th:action="@{/articles/add}" method="post">
            <div class="form-group">
                <label>Titre</label>
                <input type="text" name="title" placeholder="Titre de l'article" required/>
            </div>
            <div class="form-group">
                <label>Contenu</label>
                <textarea name="content" placeholder="Contenu de l'article..." rows="4"></textarea>
            </div>
            <button class="btn-add" type="submit">Publier ✨</button>
        </form>
    </div>

    <!-- Articles -->
    <div th:if="${#lists.isEmpty(articles)}" class="empty-state">
        <div class="empty-icon">📭</div>
        <p>Aucun article pour l'instant. Soyez le premier à publier !</p>
    </div>

    <div class="articles-grid">
        <div th:each="article : ${articles}" class="article-card">
            <div class="article-title" th:text="${article.title}"></div>
            <div class="article-content" th:text="${article.content}"></div>
            <div class="article-footer">
                <span class="comment-count">💬 <span th:text="${#lists.size(article.comments)}"></span> commentaire(s)</span>
                <div class="article-actions">
                    <a th:href="@{/articles/{id}(id=${article.id})}" class="btn-view">Voir →</a>
                    <a th:href="@{/articles/delete/{id}(id=${article.id})}" class="btn-delete">🗑️</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
