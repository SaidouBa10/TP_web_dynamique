<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Article</title>
    <style>
        body { font-family: Arial; margin: 40px; background-color: #f5f5f5; }
        h1 { color: #2196F3; }
        .card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; }
        .btn { padding: 8px 16px; color: white; border: none; cursor: pointer; border-radius: 4px; background: #2196F3; }
        input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; width: 300px; }
        .comment { border-left: 3px solid #2196F3; padding-left: 10px; margin: 10px 0; }
    </style>
</head>
<body>

<a href="/articles">← Retour</a>

<div class="card">
    <h1 th:text="${article.title}"></h1>
    <p th:text="${article.content}"></p>
</div>

<!-- Commentaires -->
<div class="card">
    <h2>💬 Commentaires</h2>
    <div th:each="comment : ${article.comments}" class="comment">
        <strong th:text="${comment.author}"></strong>
        <p th:text="${comment.text}"></p>
    </div>

    <!-- Formulaire ajout commentaire -->
    <h3>Ajouter un commentaire</h3>
    <form th:action="@{/articles/{id}/comments/add(id=${article.id})}" method="post">
        <input type="hidden" name="articleId" th:value="${article.id}"/>
        <input type="text" name="author" placeholder="Votre nom" required/><br/>
        <input type="text" name="text" placeholder="Votre commentaire" required/><br/>
        <button class="btn" type="submit">Commenter</button>
    </form>
</div>

</body>
</html>
