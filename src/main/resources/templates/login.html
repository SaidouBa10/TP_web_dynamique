<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Connexion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background-color: #f0f2f5;
               display: flex; justify-content: center;
               align-items: center; height: 100vh; }
        .login-box { background: white; padding: 40px;
                     border-radius: 12px; width: 380px;
                     box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2E75B6; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px;
                color: #555; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd;
                border-radius: 8px; font-size: 14px; }
        input:focus { outline: none; border-color: #2E75B6; }
        .btn { width: 100%; padding: 12px; background: #2E75B6;
               color: white; border: none; border-radius: 8px;
               font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #1F5C8B; }
        .error { color: red; text-align: center; margin-bottom: 15px; font-size: 14px; }
        .links { text-align: center; margin-top: 20px; font-size: 14px; }
        .links a { color: #2E75B6; text-decoration: none; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>🔐 Connexion</h2>

    <!-- Message d'erreur -->
    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/auth/login-form}" method="post">
        <div class="form-group">
            <label>Nom d'utilisateur</label>
            <input type="text" name="username" placeholder="Entrez votre username" required/>
        </div>
        <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" name="password" placeholder="Entrez votre mot de passe" required/>
        </div>
        <button class="btn" type="submit">Se connecter</button>
    </form>

    <div class="links">
        <p>Pas encore de compte ? <a th:href="@{/auth/register-form}">S'inscrire</a></p>
    </div>
</div>
</body>
</html>
