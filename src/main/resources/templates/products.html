<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Produits</title>
    <style>
        body { font-family: Arial; margin: 40px; background-color: #f5f5f5; }
        h1 { color: #4CAF50; }
        table { border-collapse: collapse; width: 100%; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .btn { padding: 8px 16px; background: #4CAF50; color: white;
               border: none; cursor: pointer; border-radius: 4px; }
        input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; }
        .form-box { background: white; padding: 20px; margin-bottom: 20px;
                    border-radius: 8px; }
    </style>
</head>
<body>

<h1>📦 Liste des Produits</h1>

<!-- Formulaire d'ajout -->
<div class="form-box">
    <h2>Ajouter un produit</h2>
    <form th:action="@{/products/add}" method="post">
        <input type="text" name="name" placeholder="Nom du produit" required/>
        <input type="number" name="price" placeholder="Prix" step="0.01" required/>
        <input type="text" name="description" placeholder="Description"/>
        <button class="btn" type="submit">Ajouter</button>
    </form>
</div>

<!-- Tableau des produits -->
<table>
    <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Prix</th>
        <th>Description</th>
        <th>Action</th>
    </tr>
    <tr th:each="product : ${products}">
        <td th:text="${product.id}"></td>
        <td th:text="${product.name}"></td>
        <td th:text="${product.price} + ' €'"></td>
        <td th:text="${product.description}"></td>
        <td>
            <a th:href="@{/products/delete/{id}(id=${product.id})}">
                <button class="btn" style="background:red;">Supprimer</button>
            </a>
        </td>
    </tr>
</table>

</body>
</html>
